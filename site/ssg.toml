#
# The public site at scoutmcp.io.
#
# This is deliberately NOT the application. scout serve runs on the
# operator's own machine because that is the whole argument: a hosted
# tester has to be handed a working credential, and this one never is.
# What ships here is what scout is, how to install it, and a real report
# so a visitor can see exactly what they would get.
site_name = "scout"
site_title = "scout — test any MCP server, from your own machine"
site_description = "A diagnostic for Model Context Protocol servers. Nine phases, 113 checks, every finding tied to the request that produced it. Runs where your credentials already live."
base_url = "https://scoutmcp.io/"
language = "en-GB"

content_dir = "site/content"
template_dir = "site/_layouts"
output_dir = "site/dist"

[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

[edge_headers]
targets = ["cloudflare", "netlify"]
