version: "2"
linters:
  default: standard
  enable:
    - revive
    # A tool that holds an operator's credentials and points them at servers
    # nobody vetted gets the security and correctness linters, not just the
    # standard set.
    - gosec
    - bodyclose
    - errorlint
    - nilerr
    - copyloopvar
    - makezero
    - rowserrcheck
    - noctx
    # contextcheck is deliberately absent: every phase derives its per-call
    # context through a closure over the phase context (pctx), and the
    # analyser cannot see through the closure, so it reports every derived
    # context as a new one. Per-file exclusions would hide real findings too.
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
    gosec:
      excludes:
        # G104 duplicates errcheck, which is already in the standard set.
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, revive, gosec, bodyclose, noctx]
      # The hostile server exists to misbehave; its handlers are deliberate.
      - path: internal/hostile/
        linters: [gosec, errcheck, noctx]

# gofmt runs as its own CI step, but only in CI. Declaring it here too means
# `golangci-lint run` locally reports the same formatting the gate enforces,
# rather than passing clean and letting the push find it.
formatters:
  enable:
    - gofmt
