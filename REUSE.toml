# SPDX-License-Identifier: GPL-3.0-only
#
# Machine-readable licensing, per the REUSE specification.
#
# Every source file in this repository already carries an SPDX header, and
# scripts/spdx_sweep.go fails the build when one does not. This file covers
# what a header cannot: generated output, binary assets, and vendored build
# artefacts, where a comment either has nowhere to go or would be rewritten
# by the generator on the next run.
#
# The distinction matters for the Cyber Resilience Act, whose full
# obligations from 11 December 2027 include machine-readable component
# licensing. A tool that asks other people to prove provenance should be
# able to prove its own.

version = 1
SPDX-PackageName = "scout"
SPDX-PackageSupplier = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/sebastienrousseau/scout"

# The embedded application shell. Generated by ssg from web/content and
# web/_layouts, committed so the binary needs no toolchain at build time, and
# therefore not a place to put a header: the generator would remove it.
#
# shell.sources is the hash of the inputs that build produced it from, written
# by the same command. It is one line of hex and a comment, so a licence
# header would be most of the file.
[[annotations]]
path = ["internal/web/dist/**", "internal/web/shell.sources"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# Generated brand assets. The sources are brand/icon.svg and
# brand/icon-maskable.svg, which carry headers; these are their renderings.
[[annotations]]
path = [
  "brand/favicon.ico",
  "brand/favicon.svg",
  "brand/apple-touch-icon.png",
  "brand/icon-192.png",
  "brand/icon-512.png",
  "brand/icon-maskable-512.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# Fuzzing corpora and test fixtures. A seed file is bytes by definition; the
# committed failing inputs are regression cases, replayed on every push.
[[annotations]]
path = ["**/testdata/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# Go module metadata. go.sum is a list of hashes and go.mod is consumed by
# the toolchain, which does not tolerate arbitrary leading comments.
[[annotations]]
path = ["go.mod", "go.sum"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# The published family manifest. Generated from internal/ecosystem, and JSON
# has no comment syntax to carry a header in; its own _comment field records
# the provenance for a human.
[[annotations]]
path = "ecosystem.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# The published attestation format: the predicate's JSON Schema and the
# scoring rubric as data. Apache-2.0, not GPL, so a gateway or registry can
# implement verification without taking on the engine's licence (ADR 0011).
# Generated by scripts/specgen from the Go that implements them; JSON has no
# comment syntax, so the licence is recorded here and in each file's
# $comment. spec/README.md carries its own header.
[[annotations]]
path = ["spec/rubric/*.json", "spec/attestation/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# The site and web layouts, vendored from the Scout theme in the SSG theme
# suite (github.com/sebastienrousseau/ssg-themes.github.io) so both build in
# CI with nothing but the ssg binary. The suite is Apache-2.0 OR MIT, and the
# Scout theme's theme.json declares MIT, which is the option taken here.
# "override" because the footers render a copyright line for the site they
# build — page text about scout, not a notice about the template.
[[annotations]]
path = ["site/_layouts/**", "web/_layouts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 - 2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "MIT"

# scout's own images: the README logo and the site's screenshots.
[[annotations]]
path = [".github/logo.png", "site/images/**", "web/images/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# Repository configuration whose formats either take no comments or are
# rewritten by their tools: docs/requirements.txt is pip-compile output.
[[annotations]]
path = [
  ".gitignore",
  ".gitattributes",
  ".gitleaksignore",
  ".github/CODEOWNERS",
  ".devcontainer/devcontainer.json",
  "docs/requirements.txt",
  ".github/reuse-requirements.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"
