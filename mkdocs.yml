site_name: scout
site_description: Onboard, test and diagnose remote MCP servers end to end.
site_url: https://scoutmcp.io/manual/
repo_url: https://github.com/sebastienrousseau/scout
repo_name: sebastienrousseau/scout
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: public
strict: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Three states rather than two: a reader whose system is dark should
    # not have to click to get the dark manual.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

extra_css:
  - assets/brand.css

repo_url: https://github.com/sebastienrousseau/scout
repo_name: sebastienrousseau/scout
edit_uri: edit/main/docs/

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Credentials: credentials.md
  - The nine phases: phases.md
  - Every check: checks.md
  - The stateless revision: stateless.md
  - Reports and telemetry: reports.md
  - Reading the evidence: evidence.md
  - Running scout in CI: ci.md
  - Configuration: configuration.md
  - Library use: library.md
  - Coming from another tool:
      - Overview: migrating/README.md
      - From MCP Inspector: migrating/from-mcp-inspector.md
      - From a curl script: migrating/from-a-curl-script.md
      - From an online playground: migrating/from-an-online-playground.md
  - For contributors:
      - Ecosystem: ecosystem.md
      - Architecture: architecture.md
      - Security model: security-model.md
      - Packaging: packaging.md
      - Decision records:
          - Index: adr/README.md
          - 0001 Bare transport for unauthenticated probes: adr/0001-bare-transport-for-unauthenticated-probes.md
          - 0002 Findings cite requests: adr/0002-findings-cite-requests.md
          - 0003 Structural redaction at the recorder: adr/0003-structural-redaction-at-the-recorder.md
          - 0004 Read-only by default: adr/0004-read-only-by-default.md
          - 0005 Public mode is the same binary: adr/0005-public-mode-is-the-same-binary.md
