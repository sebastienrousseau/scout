name: Site

# Builds and publishes scoutmcp.io.
#
# A repository gets one GitHub Pages site, so this workflow owns the whole
# of it and assembles every part into a single artifact:
#
#   /            the public site, built with SSG from the Scout theme
#   /manual/     the user manual, built with MkDocs from docs/
#   /sample/     a report scout generated by running against a fixture
#
# The sample is not a mock-up. It is produced here, in this job, by the
# binary built from this commit running against a server started beside
# it — which means the page a visitor reads is the page scout actually
# writes, and it cannot drift from the tool the way a screenshot does.
#
# What is deliberately NOT published: the application itself. `scout serve`
# runs on the operator's machine because that is the entire argument — a
# hosted tester has to be handed a working credential, and scout never is.
#
# Requires repository Settings → Pages → Source = "GitHub Actions", and a
# CNAME record at the DNS provider pointing scoutmcp.io at GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# One Pages deployment at a time, shared with any other workflow that
# touches it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install SSG
        run: cargo install ssg --locked --version 0.0.63

      - name: Build the site
        run: ssg build -f site/ssg.toml

      # SSG renders content and templates; it does not copy a static asset
      # directory, so site/images never reached the output and every <img>
      # on the deployed page resolved to a 404. The hero has been a broken
      # image icon since the first deploy.
      - name: Copy static assets
        run: |
          set -euo pipefail
          mkdir -p site/dist/images
          cp -R site/images/. site/dist/images/
          ls site/dist/images

      # GitHub Pages reads the custom domain from this file. It is written
      # after the build because SSG treats everything under content/ as a
      # page and a bare hostname has no front matter.
      - name: Write the CNAME
        run: echo scoutmcp.io > site/dist/CNAME

      - name: Build the manual
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            'mkdocs==1.6.1' 'mkdocs-material==9.6.14'
          mkdocs build --strict --site-dir site/dist/manual

      # The sample report is generated, not committed: a page that claims
      # to show scout's output should be scout's output.
      - name: Generate a sample report
        run: |
          set -euo pipefail
          go build -o /tmp/scout ./cmd/scout
          go run ./scripts/samplereport/main.go /tmp/scout site/dist/sample

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy
    # A pull request builds the site to prove it still builds; only main
    # publishes it.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
