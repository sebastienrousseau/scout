name: Manual

# Builds the user manual so a change that breaks it is caught before it
# merges. This workflow does not deploy.
#
# Publishing moved to `pages.yml` when the site at scoutmcp.io was added. A
# repository has exactly one GitHub Pages site, so two workflows that each
# upload their own artifact do not coexist: whichever ran last replaces the
# whole site. Deploying from here on a release tag would have left
# scoutmcp.io showing only the manual until the next push to main.
#
# `pages.yml` builds this same manual into /manual and publishes it with
# everything else, from one artifact.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build manual
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Pinned versions, and --strict so a broken nav entry or a dangling
      # link inside the manual fails the build rather than the reader.
      # These pins must match the ones in pages.yml, which builds the copy
      # that is actually published.
      - name: Build with MkDocs
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            'mkdocs==1.6.1' 'mkdocs-material==9.6.14'
          mkdocs build --strict --site-dir public
